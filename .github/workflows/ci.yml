name: Build & Deploy UI to AWS S3 & CloudFront

on:
  push:
    branches:
      - release
  
  pull_request:
    branches:
      - main
  
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Permissions required for AWS OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # Optional: Run tests before deploying
      - name: Run Unit Tests
        run: npm test -- --watch=false

      - name: Build Production UI
        env:
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.COGNITO_USER_POOL_CLIENT_ID }}
          COGNITO_ENDPOINT: ${{ vars.COGNITO_ENDPOINT }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          HAWKER_STALLS_URL: ${{ vars.HAWKER_STALLS_URL }}
          ORDER_SUBMIT_URL: ${{ vars.ORDER_SUBMIT_URL }}
          ORDER_QUEUE_URL: ${{ vars.ORDER_QUEUE_URL }}
          CUSTOMER_REGISTER_URL: ${{ vars.CUSTOMER_REGISTER_URL }}
          CUSTOMER_CHECK_ACCOUNT_URL: ${{ vars.CUSTOMER_CHECK_ACCOUNT_URL }}
          CUSTOMER_USER_BASE_URL: ${{ vars.CUSTOMER_USER_BASE_URL }}
          CUSTOMER_UPDATE_ORDER_URL: ${{ vars.CUSTOMER_UPDATE_ORDER_URL }}
          ORDER_STATUS_TOPIC_ARN: ${{ vars.ORDER_STATUS_TOPIC_ARN }}
        run: node set-env.js && npm run build

      # Authenticate using AWS OIDC (Recommended)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # -----------------------------------------------------------------
      # S3 Deployment with Optimal SPA Cache Headers
      # -----------------------------------------------------------------
      # 1. Upload hashed assets (JS, CSS, images) with long-lived immutable cache
      - name: "Sync Static Assets to S3 (Cache: 1 Year)"
        run: |
          aws s3 sync ${{ vars.BUILD_OUTPUT_DIR }} s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      # 2. Upload index.html with NO-CACHE so users always fetch the latest chunk references
      - name: Sync index.html to S3 (No Cache)
        run: |
          aws s3 cp ${{ vars.BUILD_OUTPUT_DIR }}/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      # -----------------------------------------------------------------
      # CloudFront Cache Invalidation
      # -----------------------------------------------------------------
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
<svg
  [attr.class]="'inline-block ' + class"
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="strokeWidth"
  stroke-linecap="round"
  stroke-linejoin="round"
  [ngSwitch]="name"
>
  <!-- utensils -->
  <g *ngSwitchCase="'utensils'">
    <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"/>
    <path d="M15 2v10"/>
    <path d="M15 12v10"/>
    <path d="M6 2v20"/>
    <path d="M3 2v6a3 3 0 0 0 6 0V2"/>
  </g>

  <!-- flame -->
  <g *ngSwitchCase="'flame'">
    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
  </g>

  <!-- soup -->
  <g *ngSwitchCase="'soup'">
    <path d="M4 11h16a1 1 0 0 1 1 1 8 8 0 0 1-18 0 1 1 0 0 1 1-1z"/>
    <path d="M6 8V5"/>
    <path d="M10 8V3"/>
    <path d="M14 8V5"/>
    <path d="M18 8V3"/>
  </g>

  <!-- coffee -->
  <g *ngSwitchCase="'coffee'">
    <path d="M10 2v2"/>
    <path d="M14 2v2"/>
    <path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h12Z"/>
    <path d="M6 2v2"/>
    <path d="M17 11h1a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3h-1"/>
  </g>

  <!-- shopping-bag -->
  <g *ngSwitchCase="'shopping-bag'">
    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
    <path d="M3 6h18"/>
    <path d="M16 10a4 4 0 0 1-8 0"/>
  </g>

  <!-- sparkles -->
  <g *ngSwitchCase="'sparkles'">
    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
  </g>

  <!-- clock -->
  <g *ngSwitchCase="'clock'">
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 6 12 12 16 14"/>
  </g>

  <!-- receipt -->
  <g *ngSwitchCase="'receipt'">
    <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"/>
    <path d="M16 8h-6"/>
    <path d="M16 12h-8"/>
    <path d="M10 16H8"/>
  </g>

  <!-- bar-chart -->
  <g *ngSwitchCase="'bar-chart'">
    <line x1="12" x2="12" y1="20" y2="10"/>
    <line x1="18" x2="18" y1="20" y2="4"/>
    <line x1="6" x2="6" y1="20" y2="16"/>
  </g>

  <!-- sliders -->
  <g *ngSwitchCase="'sliders'">
    <line x1="4" x2="4" y1="21" y2="14"/>
    <line x1="4" x2="4" y1="10" y2="3"/>
    <line x1="12" x2="12" y1="21" y2="12"/>
    <line x1="12" x2="12" y1="8" y2="3"/>
    <line x1="20" x2="20" y1="21" y2="16"/>
    <line x1="20" x2="20" y1="12" y2="3"/>
    <line x1="1" x2="7" y1="14" y2="14"/>
    <line x1="9" x2="15" y1="8" y2="8"/>
    <line x1="17" x2="23" y1="16" y2="16"/>
  </g>

  <!-- check -->
  <g *ngSwitchCase="'check'">
    <polyline points="20 6 9 17 4 12"/>
  </g>

  <!-- check-circle -->
  <g *ngSwitchCase="'check-circle'">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  </g>

  <!-- alert-circle -->
  <g *ngSwitchCase="'alert-circle'">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/>
    <line x1="12" x2="12.01" y1="16" y2="16"/>
  </g>

  <!-- x -->
  <g *ngSwitchCase="'x'">
    <line x1="18" x2="6" y1="6" y2="18"/>
    <line x1="6" x2="18" y1="6" y2="18"/>
  </g>

  <!-- plus -->
  <g *ngSwitchCase="'plus'">
    <line x1="12" x2="12" y1="5" y2="19"/>
    <line x1="5" x2="19" y1="12" y2="12"/>
  </g>

  <!-- minus -->
  <g *ngSwitchCase="'minus'">
    <line x1="5" x2="19" y1="12" y2="12"/>
  </g>

  <!-- trash -->
  <g *ngSwitchCase="'trash'">
    <path d="M3 6h18"/>
    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
  </g>

  <!-- sun -->
  <g *ngSwitchCase="'sun'">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2"/>
    <path d="M12 20v2"/>
    <path d="m4.93 4.93 1.41 1.41"/>
    <path d="m17.66 17.66 1.41 1.41"/>
    <path d="M2 12h2"/>
    <path d="M20 12h2"/>
    <path d="m6.34 17.66-1.41 1.41"/>
    <path d="m19.07 4.93-1.41 1.41"/>
  </g>

  <!-- moon -->
  <g *ngSwitchCase="'moon'">
    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
  </g>

  <!-- volume -->
  <g *ngSwitchCase="'volume'">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </g>

  <!-- volume-x -->
  <g *ngSwitchCase="'volume-x'">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <line x1="22" x2="16" y1="9" y2="15"/>
    <line x1="16" x2="22" y1="9" y2="15"/>
  </g>

  <!-- qr-code -->
  <g *ngSwitchCase="'qr-code'">
    <rect width="5" height="5" x="3" y="3" rx="1"/>
    <rect width="5" height="5" x="16" y="3" rx="1"/>
    <rect width="5" height="5" x="3" y="16" rx="1"/>
    <path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
    <path d="M21 21v.01"/>
    <path d="M12 7v3a2 2 0 0 1-2 2H7"/>
    <path d="M3 12h.01"/>
    <path d="M12 3h.01"/>
    <path d="M12 16v.01"/>
    <path d="M16 12h1"/>
    <path d="M21 12v.01"/>
    <path d="M12 21v-1"/>
  </g>

  <!-- banknote -->
  <g *ngSwitchCase="'banknote'">
    <rect width="20" height="12" x="2" y="6" rx="2"/>
    <circle cx="12" cy="12" r="2"/>
    <path d="M6 12h.01M18 12h.01"/>
  </g>

  <!-- credit-card -->
  <g *ngSwitchCase="'credit-card'">
    <rect width="20" height="14" x="2" y="5" rx="2"/>
    <line x1="2" x2="22" y1="10" y2="10"/>
  </g>

  <!-- printer -->
  <g *ngSwitchCase="'printer'">
    <polyline points="6 9 6 2 18 2 18 9"/>
    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
    <rect width="12" height="8" x="6" y="14"/>
  </g>

  <!-- search -->
  <g *ngSwitchCase="'search'">
    <circle cx="11" cy="11" r="8"/>
    <path d="m21 21-4.3-4.3"/>
  </g>

  <!-- rotate-ccw -->
  <g *ngSwitchCase="'rotate-ccw'">
    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
    <path d="M3 3v5h5"/>
  </g>

  <!-- arrow-right -->
  <g *ngSwitchCase="'arrow-right'">
    <path d="M5 12h14"/>
    <path d="m12 5 7 7-7 7"/>
  </g>

  <!-- chevron-right -->
  <g *ngSwitchCase="'chevron-right'">
    <path d="m9 18 6-6-6-6"/>
  </g>

  <!-- store -->
  <g *ngSwitchCase="'store'">
    <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/>
    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
    <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/>
    <path d="M2 7h20"/>
  </g>

  <!-- dollar-sign -->
  <g *ngSwitchCase="'dollar-sign'">
    <line x1="12" x2="12" y1="2" y2="22"/>
    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
  </g>

  <!-- user -->
  <g *ngSwitchCase="'user'">
    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
    <circle cx="12" cy="7" r="4"/>
  </g>

  <!-- log-out -->
  <g *ngSwitchCase="'log-out'">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
    <polyline points="16 17 21 12 16 7"/>
    <line x1="21" x2="9" y1="12" y2="12"/>
  </g>

  <!-- chevron-down -->
  <g *ngSwitchCase="'chevron-down'">
    <path d="m6 9 6 6 6-6"/>
  </g>

  <!-- default circle -->
  <g *ngSwitchDefault>
    <circle cx="12" cy="12" r="10"/>
  </g>
</svg>
